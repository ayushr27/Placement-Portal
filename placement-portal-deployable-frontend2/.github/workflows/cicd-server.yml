name: CICD - Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout only server/
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          pip install flake8
          flake8 .

      - name: Run pytest
        env:
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          JWT_HASH_KEY: ${{ secrets.JWT_HASH_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CELERY_REDIS_URL: ${{ secrets.CELERY_REDIS_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: pytest


      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/placement-portal-registry
          GIT_SHA=${{ github.sha }}
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$GIT_SHA .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$GIT_SHA

  deploy:
    needs: test-build-push
    runs-on: ubuntu-latest
    outputs:
        render_domain: ${{ steps.get_domain.outputs.domain }}
    steps:
      - name: Sync secrets to Render
        run: |
          # Fetch existing env vars (already an array)
          existing=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars)

          # Build new secrets JSON (same as before)
          new_secrets=$(jq -n \
            --arg MONGODB_URL "$SECRET_MONGODB_URL" \
            --arg DATABASE_NAME "$SECRET_DATABASE_NAME" \
            --arg JWT_HASH_KEY "$SECRET_JWT_HASH_KEY" \
            --arg MAIL_USERNAME "$SECRET_MAIL_USERNAME" \
            --arg MAIL_PASSWORD "$SECRET_MAIL_PASSWORD" \
            --arg UPSTASH_REDIS_REST_URL "$SECRET_UPSTASH_REDIS_REST_URL" \
            --arg UPSTASH_REDIS_REST_TOKEN "$SECRET_UPSTASH_REDIS_REST_TOKEN" \
            --arg CELERY_REDIS_URL "$SECRET_CELERY_REDIS_URL" \
            --arg GOOGLE_CLIENT_ID "$SECRET_GOOGLE_CLIENT_ID" \
            --arg GOOGLE_CLIENT_SECRET "$SECRET_GOOGLE_CLIENT_SECRET" \
            --arg GOOGLE_REDIRECT_URI "$SECRET_GOOGLE_REDIRECT_URI" \
            --arg APPS_SCRIPT_URL "$SECRET_APPS_SCRIPT_URL" \
            '[
              {key: "MONGODB_URL", value: $MONGODB_URL},
              {key: "DATABASE_NAME", value: $DATABASE_NAME},
              {key: "JWT_HASH_KEY", value: $JWT_HASH_KEY},
              {key: "MAIL_USERNAME", value: $MAIL_USERNAME},
              {key: "MAIL_PASSWORD", value: $MAIL_PASSWORD},
              {key: "UPSTASH_REDIS_REST_URL", value: $UPSTASH_REDIS_REST_URL},
              {key: "UPSTASH_REDIS_REST_TOKEN", value: $UPSTASH_REDIS_REST_TOKEN},
              {key: "CELERY_REDIS_URL", value: $CELERY_REDIS_URL},
              {key: "GOOGLE_CLIENT_ID", value: $GOOGLE_CLIENT_ID},
              {key: "GOOGLE_CLIENT_SECRET", value: $GOOGLE_CLIENT_SECRET},
              {key: "GOOGLE_REDIRECT_URI", value: $GOOGLE_REDIRECT_URI},
              {key: "APPS_SCRIPT_URL", value: $APPS_SCRIPT_URL}
            ]')

          # Merge existing + new, avoiding duplicates
          combined=$(jq -s '.[0] + .[1] | unique_by(.key)' <(echo "$existing") <(echo "$new_secrets"))


          # Optional: debug the final JSON
          echo "Merged env vars:"
          echo "$combined" | jq .

          # Push full list to Render
          curl -X PATCH \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars \
            -d "$combined"

        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SECRET_MONGODB_URL: ${{ secrets.MONGODB_URL }}
          SECRET_DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          SECRET_JWT_HASH_KEY: ${{ secrets.JWT_HASH_KEY }}
          SECRET_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SECRET_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SECRET_UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          SECRET_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SECRET_CELERY_REDIS_URL: ${{ secrets.CELERY_REDIS_URL }}
          SECRET_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SECRET_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SECRET_GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          SECRET_APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}

      - name: Trigger Render Deploy
        run: |
            curl -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys

      - name: Get Render service domain URL
        id: get_domain
        run: |
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }})
            DOMAIN=$(echo "$RESPONSE" | jq -r '.service.defaultDomain')
            echo "Render service domain: $DOMAIN"
            echo "domain=$DOMAIN" >> $GITHUB_OUTPUT

      - name: Show deployed domain
        run: echo "Deployed Render domain is ${{ steps.get_domain.outputs.domain }}"
    
      - name: Add Render domain to summary
        run: echo "### Render Deployment [Visit Render App](${{ steps.get_domain.outputs.domain }})" >> $GITHUB_STEP_SUMMARY
