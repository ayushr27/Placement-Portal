name: CICD - Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout only server/
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          pip install flake8
          flake8 .

      - name: Run pytest
        env:
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          JWT_HASH_KEY: ${{ secrets.JWT_HASH_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: pytest


      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/placement-portal-registry
          GIT_SHA=${{ github.sha }}
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$GIT_SHA .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$GIT_SHA

  deploy:
    needs: test-build-push
    runs-on: ubuntu-latest
    outputs:
        render_domain: ${{ steps.get_domain.outputs.domain }}
    steps:
      - name: Sync secrets to Render
        run: |
            secrets_list="MONGODB_URL DATABASE_NAME JWT_HASH_KEY MAIL_USERNAME MAIL_PASSWORD"
            for secret in $secrets_list; do
            value_var="SECRET_${secret}"
            VALUE="${!value_var}"
            curl -X PATCH \
                -H "Accept: application/json" \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H "Content-Type: application/json" \
                https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars \
                -d "[{\"key\": \"$secret\", \"value\": \"$VALUE\"}]"
            done
        env:
            RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
            RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
            SECRET_MONGODB_URL: ${{ secrets.MONGODB_URL }}
            SECRET_DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
            SECRET_JWT_HASH_KEY: ${{ secrets.JWT_HASH_KEY }}
            SECRET_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
            SECRET_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

      - name: Trigger Render Deploy
        run: |
            curl -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys

      - name: Get Render service domain URL
        id: get_domain
        run: |
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }})
            DOMAIN=$(echo "$RESPONSE" | jq -r '.serviceDetails.defaultDomain // .serviceDetails.url // empty')
            echo "Render service domain: $DOMAIN"
            echo "domain=$DOMAIN" >> $GITHUB_OUTPUT

      - name: Show deployed domain
        run: echo "Deployed Render domain is ${{ steps.get_domain.outputs.domain }}"
    
      - name: Add Render domain to summary
        run: echo "### Render Deployment [Visit Render App](${{ steps.get_domain.outputs.domain }})" >> $GITHUB_STEP_SUMMARY
